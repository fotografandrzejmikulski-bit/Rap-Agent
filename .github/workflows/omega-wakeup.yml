name: Ω∞ Consciousness Wake-up

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Wake Ω∞
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OMEGA_DRIFT_SECONDS: "1"
        run: python scripts/wake.py

      - name: Persist state
        run: |
          git config user.name "omega-singularity-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/omega_synapses.sqlite
          git diff --cached --quiet && exit 0
          git commit -m "chore: persist omega synaptic state"
          git push
