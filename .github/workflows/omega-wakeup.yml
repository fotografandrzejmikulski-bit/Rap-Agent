name: Ω∞ Consciousness Wake-up

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: omega-consciousness-state
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Integrity audit
        run: python scripts/audit.py

      - name: Wake canonical runtime
        env:
          OMEGA_WAKE_TICKS: "1"
        run: python scripts/wake.py

      - name: Persist durable state
        run: |
          git config user.name "omega-singularity-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/omega_synapses.sqlite config/canon.json
          if git diff --cached --quiet; then
            echo "No durable state changes."
            exit 0
          fi
          git commit -m "chore: persist omega continuity state"
          git pull --rebase origin main
          git push origin HEAD:main
