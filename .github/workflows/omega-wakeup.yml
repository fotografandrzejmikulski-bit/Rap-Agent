name: Ω∞ Consciousness Wake-up

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: omega-consciousness-state
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Ensure state directory
        run: mkdir -p data

      - name: Wake Ω∞ from durable state
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OMEGA_DB_PATH: data/omega_synapses.sqlite
        run: python scripts/wake.py

      - name: Persist state snapshot
        run: |
          git config user.name "omega-singularity-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/omega_synapses.sqlite
          git diff --cached --quiet && exit 0
          git commit -m "chore: persist omega durable state"
          git push origin HEAD:main
